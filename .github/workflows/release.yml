# Manual release only. Stephen starts this from the Actions tab.
# It does not run on push, pull request, schedule, or tag.
# Builds the private cloudcake/phun-source with a read-only deploy key
# (secret PHUN_DEPLOY_KEY) and publishes the installers on this public repo.
# The source is never committed here.
# Before each OS build, the entered tag (leading 'v' stripped, must be
# semver) is stamped into the phun checkout so installer names and the
# in-app version match the release. The GUI should read that build
# version (Tauri getVersion / AboutMetadata), not a hardcoded string.
# No smoke tests run here: the linux-smoke, macos-smoke and windows-smoke
# workflows run them on demand, so a runner that never starts cannot hold up
# publishing.
# After the release is published, the sync job writes the bookkeeping back
# to cloudcake/phun-source main: the changelog's Unreleased section becomes this
# version and the manifests move to the next patch. That needs the deploy
# key to have write access.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version / tag to create or update
        required: true
        type: string
      ref:
        description: Branch, tag or commit of cloudcake/phun-source to build
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  # Pin the ref to one commit so every build and the final sync job work on
  # the same source even if main moves while the release is running.
  resolve:
    name: Resolve source commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: cloudcake/phun-source
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.PHUN_DEPLOY_KEY }}
          persist-credentials: false
      - name: Record the commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others; Stephen needs
      # every job's real result (attach flakes must not hide arm64).
      fail-fast: false
      matrix:
        include:
          - name: debian
            os: ubuntu-latest
            kind: linux
            target: x86_64-unknown-linux-gnu
          # Apple silicon runner. macos-latest (macOS 15) rather than macos-26:
          # Tauri's bundle_dmg.sh lays the DMG window out through Finder via
          # AppleScript, and that failed on the macos-26 image while the same
          # step passed on macos-latest in the Intel job.
          - name: macos-arm64
            os: macos-latest
            kind: macos
            target: aarch64-apple-darwin
          # Intel installer: cross-compile on an ARM runner (macos-latest is
          # macos-14+ Apple silicon). Do not use macos-13 / *-intel runners.
          - name: macos-x64
            os: macos-latest
            kind: macos
            target: x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            kind: windows
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: cloudcake/phun-source
          ref: ${{ needs.resolve.outputs.sha }}
          ssh-key: ${{ secrets.PHUN_DEPLOY_KEY }}
          persist-credentials: false

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Add Intel macOS Rust target
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ github.workspace }}
          key: ${{ matrix.target }}

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/phun-gui/package-lock.json

      # The private checkout replaced this repo. Pull the stamp script
      # from this repository into a side directory, then remove it so it
      # cannot leak into the bundle.
      - name: Checkout version stamp script
        uses: actions/checkout@v7
        with:
          path: .release-tools
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Stamp version from the release tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Windows runners may only expose `python`, not `python3`.
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          else
            PY=python
          fi
          "$PY" .release-tools/.github/scripts/stamp-version.py \
            --tag "$TAG" \
            --root .
          rm -rf .release-tools

      - name: Build the .deb
        if: matrix.kind == 'linux'
        run: ./scripts/build.sh --no-install

      - name: Build the .dmg
        if: matrix.kind == 'macos' && matrix.target != 'x86_64-apple-darwin'
        run: ./scripts/build.sh --no-install

      - name: Build the Intel .dmg
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          set -euo pipefail
          # Tauri: tauri build --target x86_64-apple-darwin
          # phund (and the other workspace bins) likewise via --target.
          ./scripts/build.sh --no-install --target x86_64-apple-darwin

      - name: Build the Windows installers
        if: matrix.kind == 'windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build.ps1 -NoInstall

      # build.sh builds the .app with `tauri build --bundles app --no-sign`
      # and then a styled DMG (background, icon layout, window size from
      # tauri.bundle-macos.conf.json). A later hdiutil -srcfolder rebuild
      # drops that Finder styling. Ad-hoc sign the .app, then re-run
      # Tauri's dmg bundler (signingIdentity "-") so the signed app is
      # packed into the original styled DMG. Verify the .app inside the
      # final image, not a plain srcfolder remake.
      - name: Ad-hoc sign the .app, remake the styled DMG, and verify
        if: matrix.kind == 'macos'
        env:
          RUST_TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.tag }}
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          set -euo pipefail
          roots=()
          for root in target apps/phun-gui/src-tauri/target; do
            if [ -d "$root" ]; then
              roots+=("$root")
            fi
          done
          if [ "${#roots[@]}" -eq 0 ]; then
            echo "no build output directory" >&2
            exit 1
          fi

          # Intel must come from the cross-compile target directory so a
          # host-arch (aarch64) .app cannot be packaged as x64.
          app=""
          for root in "${roots[@]}"; do
            candidate="$root/$RUST_TARGET/release/bundle/macos/Phun.app"
            if [ -d "$candidate" ]; then
              app="$candidate"
              break
            fi
          done
          if [ -z "$app" ] && [ "$RUST_TARGET" != "x86_64-apple-darwin" ]; then
            for root in "${roots[@]}"; do
              candidate="$root/release/bundle/macos/Phun.app"
              if [ -d "$candidate" ]; then
                app="$candidate"
                break
              fi
            done
          fi
          if [ -z "$app" ]; then
            echo "Phun.app not found under ${roots[*]} for $RUST_TARGET" >&2
            exit 1
          fi
          echo "signing $app"
          codesign --force --deep --sign - "$app"

          gui=apps/phun-gui
          if [ ! -d "$gui/node_modules" ]; then
            echo "missing $gui/node_modules; npm ci should have run in build.sh" >&2
            exit 1
          fi
          extra=()
          if [ "$RUST_TARGET" = "x86_64-apple-darwin" ]; then
            extra+=(--target x86_64-apple-darwin)
          fi
          extra+=(--bundles dmg)
          if [ -f "$gui/src-tauri/tauri.bundle-macos.conf.json" ]; then
            extra+=(--config src-tauri/tauri.bundle-macos.conf.json)
          fi
          extra+=(--config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}')
          echo "re-bundling styled dmg: npm run tauri -- bundle ${extra[*]}"
          # bundle_dmg.sh (hdiutil + Finder AppleScript) fails intermittently on
          # hosted runners; a second or third attempt normally succeeds.
          bundled=0
          for attempt in 1 2 3; do
            if (cd "$gui" && npm run tauri -- bundle "${extra[@]}"); then
              bundled=1
              break
            fi
            echo "dmg bundle attempt $attempt failed; retrying in 10s" >&2
            sleep 10
          done
          if [ "$bundled" -ne 1 ]; then
            echo "dmg bundling failed after 3 attempts" >&2
            exit 1
          fi

          VERSION="$TAG"
          case "$VERSION" in
            v*|V*) VERSION="${VERSION#?}" ;;
          esac
          if [ -z "$VERSION" ]; then
            echo "empty version after stripping a leading v from tag $TAG" >&2
            exit 1
          fi
          case "$RUST_TARGET" in
            aarch64-apple-darwin) dmg_name="Phun_${VERSION}_apple-silicon.dmg" ;;
            x86_64-apple-darwin) dmg_name="Phun_${VERSION}_intel.dmg" ;;
          esac

          dmg=""
          for root in "${roots[@]}"; do
            for dir in \
              "$root/$RUST_TARGET/release/bundle/dmg" \
              "$root/release/bundle/dmg"; do
              if [ "$RUST_TARGET" = "x86_64-apple-darwin" ] && [[ "$dir" != *"/x86_64-apple-darwin/"* ]]; then
                continue
              fi
              if [ ! -d "$dir" ]; then
                continue
              fi
              found=$(find "$dir" -maxdepth 1 -type f -name 'Phun_*.dmg' -print)
              if [ -n "$found" ]; then
                dmg=$(printf '%s\n' "$found" | head -n 1)
                break 2
              fi
            done
          done
          if [ -z "$dmg" ] || [ ! -f "$dmg" ]; then
            echo "styled Tauri dmg not found under ${roots[*]} for $RUST_TARGET" >&2
            exit 1
          fi
          mkdir -p dist
          out="$(pwd)/dist/$dmg_name"
          cp "$dmg" "$out"
          echo "copied $dmg -> $out"

          # The styled DMG carries an SLA. hdiutil attach waits for
          # licence acceptance and, with no TTY, returns 112 "attach
          # canceled". Pipe yes so CI accepts without stripping the SLA
          # from the published image.
          mnt=$(mktemp -d)
          detach() {
            hdiutil detach "$mnt" -force >/dev/null 2>&1 || true
            rm -rf "$mnt"
          }
          trap detach EXIT
          # `{ yes || true; }` so SIGPIPE from yes after a successful
          # attach does not fail the pipeline under pipefail.
          if ! { yes || true; } | hdiutil attach -nobrowse -noautoopen -readonly -mountpoint "$mnt" "$out"; then
            echo "hdiutil attach failed (SLA or image error) for $out" >&2
            exit 1
          fi
          inner="$mnt/Phun.app"
          if [ ! -d "$inner" ]; then
            echo "Phun.app missing from $out" >&2
            ls -la "$mnt" >&2
            exit 1
          fi
          echo "verifying $inner"
          codesign --verify --deep --strict --verbose=2 "$inner"

          plist="$inner/Contents/Info.plist"
          if [ ! -f "$plist" ]; then
            echo "missing Info.plist in $inner" >&2
            exit 1
          fi
          exe_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
          exe="$inner/Contents/MacOS/$exe_name"
          if [ ! -f "$exe" ]; then
            echo "missing main executable $exe" >&2
            exit 1
          fi

          case "$RUST_TARGET" in
            aarch64-apple-darwin) expected=arm64 ;;
            x86_64-apple-darwin) expected=x86_64 ;;
            *)
              echo "unexpected macOS target $RUST_TARGET" >&2
              exit 1
              ;;
          esac
          archs=$(lipo -archs "$exe")
          echo "lipo -archs $exe: $archs"
          trimmed=$(printf '%s' "$archs" | tr -s '[:space:]' ' ')
          trimmed=${trimmed# }
          trimmed=${trimmed% }
          if [ "$trimmed" != "$expected" ]; then
            echo "expected $expected, lipo -archs reported: $archs" >&2
            exit 1
          fi
          echo "verified signed $expected Phun.app inside $out"

      - name: Collect Linux and macOS installers
        if: matrix.kind != 'windows'
        env:
          KIND: ${{ matrix.kind }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$KIND" = "linux" ]; then
            # Tauri writes the workspace target/ when the crate is in a
            # workspace, and src-tauri/target otherwise. GNU find exits
            # non-zero for a missing start path, which aborts this step
            # under set -e even when the other directory has the bundles.
            roots=()
            for root in target apps/phun-gui/src-tauri/target; do
              if [ -d "$root" ]; then
                roots+=("$root")
              fi
            done
            if [ "${#roots[@]}" -eq 0 ]; then
              echo "no build output directory" >&2
              exit 1
            fi
            find "${roots[@]}" \
              -type f -path '*/bundle/*' \
              -name '*.deb' \
              -exec cp {} dist/ \;
          elif [ "$KIND" = "macos" ]; then
            # macOS: the ad-hoc-signed, styled, renamed .dmg is already in
            # dist/. Do not copy Tauri's default-arch-named .dmg.
            if [ -z "$(find dist -type f -name '*.dmg' -print -quit)" ]; then
              echo "signed macOS dmg missing from dist/" >&2
              exit 1
            fi
          else
            echo "unexpected kind $KIND" >&2
            exit 1
          fi
          find dist -type f -print
          test -n "$(find dist -type f -print -quit)"
          VERSION="$TAG"
          case "$VERSION" in
            v*|V*) VERSION="${VERSION#?}" ;;
          esac
          if [ -z "$VERSION" ]; then
            echo "empty version after stripping a leading v from tag $TAG" >&2
            exit 1
          fi
          mismatch=0
          while IFS= read -r f; do
            base=$(basename "$f")
            case "$base" in
              *"$VERSION"*) ;;
              *)
                echo "artifact $base does not contain version $VERSION" >&2
                mismatch=1
                ;;
            esac
          done < <(find dist -type f -print)
          if [ "$mismatch" -ne 0 ]; then
            echo "installer names must include the tag version $VERSION" >&2
            exit 1
          fi

      - name: Collect Windows installers
        if: matrix.kind == 'windows'
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = $env:TAG
          if ($version -match '^[vV]') { $version = $version.Substring(1) }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "empty version after stripping a leading v from tag $($env:TAG)"
          }

          $roots = @()
          foreach ($root in @('target', 'apps/phun-gui/src-tauri/target')) {
            if (Test-Path $root) { $roots += $root }
          }
          if ($roots.Count -eq 0) { throw 'no build output directory' }

          # Tauri writes bundle/nsis/Phun_<ver>_x64-setup.exe under
          # target/release/bundle or apps/phun-gui/src-tauri/target/release/bundle.
          $nsis = @()
          foreach ($root in $roots) {
            $foundNsis = Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' -and
                $_.Name -like 'Phun_*_x64-setup.exe'
              }
            if ($foundNsis) { $nsis += @($foundNsis) }
          }
          if ($nsis.Count -eq 0) { throw 'no bundle/nsis/Phun_*_x64-setup.exe' }
          if ($nsis.Count -ne 1) {
            throw "expected 1 NSIS setup, found $($nsis.Count): $($nsis.Name -join ', ')"
          }
          if ($nsis[0].Name -notlike "*${version}*") {
            throw "artifact $($nsis[0].Name) does not contain version $version"
          }

          $exeOut = "Phun_${version}_windows-x64-setup.exe"
          Copy-Item $nsis[0].FullName -Destination (Join-Path 'dist' $exeOut) -Force
          $files = @(Get-ChildItem dist -File)
          if ($files.Count -eq 0) { throw 'no Windows installer was produced' }
          $mismatch = $false
          foreach ($f in $files) {
            Write-Host $f.Name
            if ($f.Name -notlike "*${version}*") {
              Write-Host "artifact $($f.Name) does not contain version $version"
              $mismatch = $true
            }
          }
          if ($mismatch) {
            throw "installer names must include the tag version $version"
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # The Arch package, built in the archlinux container by phun-source's
  # scripts/build-arch.sh: it installs packaging/arch/PKGBUILD's dependencies,
  # runs makepkg as a plain user (makepkg refuses root) and writes
  # dist/Phun_<version>_x86_64.pkg.tar.zst, the name phun-update's pacman
  # matcher selects. The package is then installed in the same container as a
  # check. No Rust cache: the container's builder user and paths differ from
  # the runner's, and a release is rare enough to build cold.
  arch:
    name: arch
    needs: resolve
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      # git and ssh first: without them actions/checkout cannot use the
      # deploy key. python runs the stamp script.
      - name: Checkout tools
        run: pacman -Syu --noconfirm --needed git openssh python

      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: cloudcake/phun-source
          ref: ${{ needs.resolve.outputs.sha }}
          ssh-key: ${{ secrets.PHUN_DEPLOY_KEY }}
          persist-credentials: false

      - name: Checkout version stamp script
        uses: actions/checkout@v7
        with:
          path: .release-tools
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Stamp version from the release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 .release-tools/.github/scripts/stamp-version.py \
            --tag "$TAG" \
            --root .
          rm -rf .release-tools

      - name: Build the .pkg.tar.zst
        env:
          TAG: ${{ inputs.tag }}
        run: bash scripts/build-arch.sh "$TAG"

      - name: Install the package and check it
        run: |
          set -euo pipefail
          pacman -U --noconfirm dist/Phun_*_x86_64.pkg.tar.zst
          fmt=$(phund --pkg-format)
          if [ "$fmt" != pacman ]; then
            echo "phund --pkg-format printed '$fmt' (expected pacman)" >&2
            exit 1
          fi
          phun --version
          for f in /usr/bin/phun /usr/bin/phund /usr/bin/phun-helper /usr/bin/phun-gui \
            /usr/lib/Phun/php-ext/pcov/SHA256SUMS /usr/lib/Phun/php-ext/xdebug/SHA256SUMS \
            /usr/share/applications/phun-gui.desktop; do
            test -e "$f" || { echo "missing $f" >&2; exit 1; }
          done

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-arch
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [build, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true

      # SHA256SUMS and `<installer>.minisig` are what phun-update's
      # select_asset looks for next to each installer. The signatures need
      # the minisign secret key (secret PHUN_MINISIGN_KEY, its password in
      # PHUN_MINISIGN_PASSWORD when it has one) whose public half is
      # UPDATE_PUBLIC_KEY in crates/phun-update; without it the release
      # ships unsigned, as before, and only warns.
      - name: Checksums and update signatures
        env:
          MINISIGN_KEY: ${{ secrets.PHUN_MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.PHUN_MINISIGN_PASSWORD }}
          UPDATE_PUBLIC_KEY: RWRXUQIpU8uZ3B6SV3yFsK3+aAWZX+efytjc8F+8PTuViL8/nNPsQxpi
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          installers=(*)
          sha256sum -- "${installers[@]}" > SHA256SUMS
          cat SHA256SUMS
          if [ -z "$MINISIGN_KEY" ]; then
            echo "::warning title=Installers not signed::PHUN_MINISIGN_KEY is not set, so the release has no .minisig files and phun update --yes cannot install it."
            exit 0
          fi
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq minisign >/dev/null
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_KEY" > "$key"
          for f in "${installers[@]}"; do
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m "$f" -x "$f.minisig" >/dev/null
            minisign -V -q -P "$UPDATE_PUBLIC_KEY" -m "$f" -x "$f.minisig"
          done
          ls -la

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "tag must be a version token such as v2.1.0-rc.1" >&2
            exit 1
          fi
          shopt -s nullglob
          files=(release-assets/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no installers were downloaded" >&2
            exit 1
          fi
          printf 'attaching:\n'
          printf '  %s\n' "${files[@]}"
          signing="Updater signing is off."
          if [ -n "$(find release-assets -name '*.minisig' -print -quit)" ]; then
            signing="Each installer has a minisign signature (.minisig) and SHA256SUMS lists their checksums."
          fi
          notes="Phun ${TAG}. Mac builds are ad-hoc signed, not notarized; on first launch right-click Phun > Open, or run \`xattr -cr /Applications/Phun.app\`. Apple Silicon Macs use the apple-silicon dmg, Intel Macs the intel dmg. The Windows installer is unsigned, so SmartScreen may warn ('More info' > 'Run anyway'). On Debian and Ubuntu install the .deb; on Arch run \`sudo pacman -U ./Phun_<version>_x86_64.pkg.tar.zst\`. ${signing}"
          if gh release view --repo "$GITHUB_REPOSITORY" "$TAG" >/dev/null 2>&1; then
            gh release upload --repo "$GITHUB_REPOSITORY" "$TAG" "${files[@]}" --clobber
          elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh release create --repo "$GITHUB_REPOSITORY" "$TAG" "${files[@]}" --title "$TAG" --notes "$notes"
          else
            gh release create --repo "$GITHUB_REPOSITORY" "$TAG" "${files[@]}" --target "${GITHUB_REF_NAME}" --title "$TAG" --notes "$notes"
          fi

  # Points this repository's README at the release just published, so its
  # download links always lead to the newest build. Pre-releases leave it
  # alone. A failure here never fails the release; it only warns.
  readme:
    name: Point the README and its download headers at this release
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Rewrite the download block
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -uo pipefail
          warn() { echo "::warning title=README not updated::$1"; exit 0; }
          mapfile -t assets < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name') || warn "Could not list the $TAG installers."
          args=()
          for name in "${assets[@]}"; do args+=(--asset "$name"); done
          python3 .github/scripts/update-readme.py --tag "$TAG" --repo "$GITHUB_REPOSITORY" "${args[@]}" || warn "The README has no download block to update."
          # The platform headers carry the version, drawn from Lato and DejaVu Sans Mono.
          if ! [[ "${TAG#[vV]}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$TAG is a pre-release; the README and its headers stay as they are."
            exit 0
          fi
          if sudo apt-get install -y -qq fonts-lato fonts-dejavu-core >/dev/null && PHUN_VERSION="${TAG#[vV]}" python3 .github/readme/build.py platforms; then
            git add .github/readme/download
          else
            echo "::warning title=Download headers not redrawn::The README links $TAG, but its platform headers still show the previous version."
            git checkout -- .github/readme/download || true
          fi
          if git diff --quiet HEAD; then
            echo "::notice::The README already offers $TAG."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "README: link the $TAG downloads" || warn "Could not commit."
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main || { git rebase --abort; warn "main moved and the README change conflicts."; }
          done
          warn "Could not push the README to main."

  # Keeps the repository in step with what shipped. A failure here never
  # fails the release: the installers are already published, so it only
  # raises a warning telling Stephen to run `cargo xtask bump` by hand.
  sync:
    name: Sync version and changelog
    needs: [resolve, release]
    if: inputs.ref == 'main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout the built commit
        uses: actions/checkout@v7
        with:
          repository: cloudcake/phun-source
          ref: ${{ needs.resolve.outputs.sha }}
          ssh-key: ${{ secrets.PHUN_DEPLOY_KEY }}
          fetch-depth: 0

      - name: Checkout stamp script
        uses: actions/checkout@v7
        with:
          path: .release-tools
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Release the changelog and bump to the next version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -uo pipefail
          warn() { echo "::warning title=Version sync skipped::$1 Run 'cargo xtask bump' locally to finish the release bookkeeping."; exit 0; }

          version="${TAG#[vV]}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::notice::$TAG is not a plain X.Y.Z release, nothing to sync."
            exit 0
          fi
          next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"

          current=$(python3 - <<'PY'
          import re
          m = re.search(r'(?m)^version\s*=\s*"([^"]+)"', open("Cargo.toml").read())
          print(m.group(1) if m else "")
          PY
          )
          newer=$(python3 - "$current" "$version" <<'PY'
          import sys
          def t(v): return tuple(int(x) for x in v.split("."))
          try:
              print("yes" if t(sys.argv[1]) > t(sys.argv[2]) else "no")
          except ValueError:
              print("unknown")
          PY
          )
          if [ "$newer" != "no" ]; then
            echo "::notice::The repository is at '$current', already past $version. Nothing to sync."
            exit 0
          fi

          stamp=.release-tools/.github/scripts/stamp-version.py
          python3 "$stamp" --tag "v$version" --manifests-only --root . || warn "Could not release the changelog for $version."
          python3 "$stamp" --tag "v$next" --manifests-only --no-changelog --root . || warn "Could not bump the manifests to $next."
          rm -rf .release-tools

          if git diff --quiet; then
            echo "::notice::Nothing changed, nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -a -m "Release $version, start $next [skip changelog]" || warn "Could not commit."
          git fetch origin main || warn "Could not fetch main."
          git rebase origin/main || { git rebase --abort; warn "main moved while the release was building and the changes conflict."; }
          git push origin HEAD:main || warn "Could not push to main (the deploy key needs write access)."
          echo "::notice title=Version synced::Released $version in the changelog and bumped the repository to $next."
