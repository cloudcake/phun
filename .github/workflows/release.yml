# Manual release only. Stephen starts this from the Actions tab.
# It does not run on push, pull request, schedule, or tag.
# Builds the private cloudcake/phun source with a read-only deploy key
# (secret PHUN_DEPLOY_KEY) and publishes the installers on this public repo.
# The source is never committed here.
# Before each OS build, the entered tag (leading 'v' stripped, must be
# semver) is stamped into the phun checkout so installer names and the
# in-app version match the release. The GUI should read that build
# version (Tauri getVersion / AboutMetadata), not a hardcoded string.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version / tag to create or update
        required: true
        type: string
      ref:
        description: Branch, tag or commit of cloudcake/phun to build
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian
            os: ubuntu-latest
            kind: linux
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-26
            kind: macos
            target: aarch64-apple-darwin
          # Intel installer: cross-compile on an ARM runner (macos-latest is
          # macos-14+ Apple silicon). Do not use macos-13 / *-intel runners.
          - name: macos-x64
            os: macos-latest
            kind: macos
            target: x86_64-apple-darwin
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: cloudcake/phun
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.PHUN_DEPLOY_KEY }}
          persist-credentials: false

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Add Intel macOS Rust target
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ github.workspace }}
          key: ${{ matrix.target }}

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/phun-gui/package-lock.json

      # The private checkout replaced this repo. Pull the stamp script
      # from phun-releases into a side directory, then remove it so it
      # cannot leak into the bundle.
      - name: Checkout version stamp script
        uses: actions/checkout@v7
        with:
          path: .phun-releases-tools
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Stamp version from the release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 .phun-releases-tools/.github/scripts/stamp-version.py \
            --tag "$TAG" \
            --root .
          rm -rf .phun-releases-tools

      - name: Build the .deb
        if: matrix.kind == 'linux'
        run: ./scripts/build.sh --no-install

      - name: Build the .dmg
        if: matrix.kind == 'macos' && matrix.target != 'x86_64-apple-darwin'
        run: ./scripts/build.sh --no-install

      - name: Build the Intel .dmg
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          set -euo pipefail
          # Tauri: tauri build --target x86_64-apple-darwin
          # phund (and the other workspace bins) likewise via --target.
          ./scripts/build.sh --no-install --target x86_64-apple-darwin

      # Tauri's unsigned .app is rejected by Gatekeeper as "damaged".
      # Ad-hoc sign both macOS jobs (no Developer ID / notarization), verify
      # the signature and a single expected arch, then rebuild the .dmg so
      # testers download the signed .app. Do not copy Tauri's original dmg.
      - name: Ad-hoc sign the .app, verify, and rebuild the .dmg
        if: matrix.kind == 'macos'
        env:
          RUST_TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          roots=()
          for root in target apps/phun-gui/src-tauri/target; do
            if [ -d "$root" ]; then
              roots+=("$root")
            fi
          done
          if [ "${#roots[@]}" -eq 0 ]; then
            echo "no build output directory" >&2
            exit 1
          fi

          # Intel must come from the cross-compile target directory so a
          # host-arch (aarch64) .app cannot be packaged as x64.
          app=""
          for root in "${roots[@]}"; do
            candidate="$root/$RUST_TARGET/release/bundle/macos/Phun.app"
            if [ -d "$candidate" ]; then
              app="$candidate"
              break
            fi
          done
          if [ -z "$app" ] && [ "$RUST_TARGET" != "x86_64-apple-darwin" ]; then
            for root in "${roots[@]}"; do
              candidate="$root/release/bundle/macos/Phun.app"
              if [ -d "$candidate" ]; then
                app="$candidate"
                break
              fi
            done
          fi
          if [ -z "$app" ]; then
            echo "Phun.app not found under ${roots[*]} for $RUST_TARGET" >&2
            exit 1
          fi
          echo "signing $app"

          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          plist="$app/Contents/Info.plist"
          if [ ! -f "$plist" ]; then
            echo "missing Info.plist in $app" >&2
            exit 1
          fi
          exe_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
          exe="$app/Contents/MacOS/$exe_name"
          if [ ! -f "$exe" ]; then
            echo "missing main executable $exe" >&2
            exit 1
          fi

          case "$RUST_TARGET" in
            aarch64-apple-darwin) expected=arm64 ;;
            x86_64-apple-darwin) expected=x86_64 ;;
            *)
              echo "unexpected macOS target $RUST_TARGET" >&2
              exit 1
              ;;
          esac
          archs=$(lipo -archs "$exe")
          echo "lipo -archs $exe: $archs"
          trimmed=$(printf '%s' "$archs" | tr -s '[:space:]' ' ')
          trimmed=${trimmed# }
          trimmed=${trimmed% }
          if [ "$trimmed" != "$expected" ]; then
            echo "expected $expected, lipo -archs reported: $archs" >&2
            exit 1
          fi

          VERSION="$TAG"
          case "$VERSION" in
            v*|V*) VERSION="${VERSION#?}" ;;
          esac
          if [ -z "$VERSION" ]; then
            echo "empty version after stripping a leading v from tag $TAG" >&2
            exit 1
          fi
          case "$RUST_TARGET" in
            aarch64-apple-darwin) dmg_name="Phun_${VERSION}_apple-silicon.dmg" ;;
            x86_64-apple-darwin) dmg_name="Phun_${VERSION}_intel.dmg" ;;
          esac

          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT
          ditto "$app" "$staging/Phun.app"
          ln -s /Applications "$staging/Applications"
          mkdir -p dist
          out="$(pwd)/dist/$dmg_name"
          hdiutil create -volname Phun -srcfolder "$staging" -ov -format UDZO -o "$out"
          if [ ! -f "$out" ]; then
            echo "hdiutil did not write $out" >&2
            exit 1
          fi
          echo "wrote $out"

      - name: Collect Linux and macOS installers
        env:
          KIND: ${{ matrix.kind }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$KIND" = "linux" ]; then
            # Tauri writes the workspace target/ when the crate is in a
            # workspace, and src-tauri/target otherwise. GNU find exits
            # non-zero for a missing start path, which aborts this step
            # under set -e even when the other directory has the bundles.
            roots=()
            for root in target apps/phun-gui/src-tauri/target; do
              if [ -d "$root" ]; then
                roots+=("$root")
              fi
            done
            if [ "${#roots[@]}" -eq 0 ]; then
              echo "no build output directory" >&2
              exit 1
            fi
            find "${roots[@]}" \
              -type f -path '*/bundle/*' \
              -name '*.deb' \
              -exec cp {} dist/ \;
          else
            # macOS: the ad-hoc-signed, renamed .dmg is already in dist/.
            # Do not copy Tauri's original unsigned .dmg.
            if [ -z "$(find dist -type f -name '*.dmg' -print -quit)" ]; then
              echo "signed macOS dmg missing from dist/" >&2
              exit 1
            fi
          fi
          find dist -type f -print
          test -n "$(find dist -type f -print -quit)"
          VERSION="$TAG"
          case "$VERSION" in
            v*|V*) VERSION="${VERSION#?}" ;;
          esac
          if [ -z "$VERSION" ]; then
            echo "empty version after stripping a leading v from tag $TAG" >&2
            exit 1
          fi
          mismatch=0
          while IFS= read -r f; do
            base=$(basename "$f")
            case "$base" in
              *"$VERSION"*) ;;
              *)
                echo "artifact $base does not contain version $VERSION" >&2
                mismatch=1
                ;;
            esac
          done < <(find dist -type f -print)
          if [ "$mismatch" -ne 0 ]; then
            echo "installer names must include the tag version $VERSION" >&2
            exit 1
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "tag must be a version token such as v2.1.0-rc.1" >&2
            exit 1
          fi
          shopt -s nullglob
          files=(release-assets/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no installers were downloaded" >&2
            exit 1
          fi
          printf 'attaching:\n'
          printf '  %s\n' "${files[@]}"
          notes="Phun ${TAG}. Mac builds are ad-hoc signed, not notarized; on first launch right-click Phun > Open, or run \`xattr -cr /Applications/Phun.app\`. Apple Silicon Macs use the apple-silicon dmg, Intel Macs the intel dmg. Updater signing is off."
          if gh release view --repo "$GITHUB_REPOSITORY" "$TAG" >/dev/null 2>&1; then
            gh release upload --repo "$GITHUB_REPOSITORY" "$TAG" "${files[@]}" --clobber
          elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh release create --repo "$GITHUB_REPOSITORY" "$TAG" "${files[@]}" --title "$TAG" --notes "$notes"
          else
            gh release create --repo "$GITHUB_REPOSITORY" "$TAG" "${files[@]}" --target "${GITHUB_REF_NAME}" --title "$TAG" --notes "$notes"
          fi
